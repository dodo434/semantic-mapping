name: Stage 1 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stage-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck stage-01/*.sh
      - run: python3 -m unittest discover -s tests -v
